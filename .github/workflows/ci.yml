name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PowerShell 7.6 or later
        shell: pwsh
        run: |
          $required = [version]'7.6'
          if ($PSVersionTable.PSVersion -ge $required) {
            Write-Host "PowerShell $($PSVersionTable.PSVersion) satisfies the minimum."
            return
          }
          $destination = Join-Path $env:RUNNER_TEMP 'pwsh76'
          $script = Join-Path $env:RUNNER_TEMP 'install-powershell.ps1'
          Invoke-WebRequest -Uri 'https://aka.ms/install-powershell.ps1' -OutFile $script
          & $script -Version '7.6.9' -Destination $destination
          Add-Content -Path $env:GITHUB_PATH -Value $destination

      - name: Show PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or later is required.' }

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./Dataverse.psd1 | Format-List Name, Version, PowerShellVersion

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'Integration'
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './TestResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults.xml
          if-no-files-found: ignore
